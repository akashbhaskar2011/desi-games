services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desi_games
      POSTGRES_USER: desi_games
      POSTGRES_PASSWORD: desi_games_dev
    ports:
      - "5432:5432"
    volumes:
      - desi-games-postgres:/var/lib/postgresql/data

volumes:
  desi-games-postgres: